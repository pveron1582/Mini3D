name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sin pnpm en CI: el proyecto no tiene dependencias que instalar y los
      # scripts de package.json ya invocan `npm run` por dentro (el verify
      # usa npm run check/test/test:load). pnpm/action-setup@v4 fallaba en
      # este runner y no aportaba nada acá.
      # Suite completa: imports + ciclos (check-scc) + suite funcional (p7-test)
      # + carga de proyecto (p7-loadtest) + geo-cache (Node puro, ver SKILL.md).
      - name: verify (imports + ciclos + tests + carga + geo-cache)
        run: npm run verify
